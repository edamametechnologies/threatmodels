name: Sign data manifest

# Signs signed/manifest-data.json (every *-db.json and consent/*) with the CI
# signing key after anything it covers lands on main, and opens an auto-merge
# PR with the result, like the daily blacklists update.
#
# The exec manifest (threatmodel-*.json, whose cli targets the helper runs
# elevated) is NEVER signed here: it is signed offline with a root key and
# committed in the PR that changes a threat model (see
# src/publish/sign-manifest.py). Clients refuse a CI-key signature on it.
#
# Secrets live in the `model-signing` environment, restricted to the main
# branch (Settings > Environments > model-signing > Deployment branches):
#   MODEL_SIGNING_KEY   PKCS#8 PEM Ed25519 CI key
#   MODEL_SIGNING_CERT  certificate for that key from `sign-manifest.py certify`
#                       (root-signed, at most 90 days; renew before not_after)
# Repository variable:
#   MODEL_ROOT_PUBLIC_KEYS  space-separated hex root public keys (the ones
#                           embedded in threatmodels-rs PRODUCTION_ROOT_KEYS)

on:
  push:
    branches: ["main"]
    paths:
      - '*-db.json'
      - 'consent/**'
  workflow_dispatch:

concurrency:
  group: sign-data-manifest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sign-data:
    if: vars.MODEL_ROOT_PUBLIC_KEYS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: model-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v3.1.4
        with:
          python-version: 3.11.3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build data manifest
        run: python3 src/publish/sign-manifest.py build --scope data --branch main

      - name: Sign data manifest
        if: hashFiles('signed/manifest-data.sig.json') == ''
        env:
          MODEL_SIGNING_KEY: ${{ secrets.MODEL_SIGNING_KEY }}
          MODEL_SIGNING_CERT: ${{ secrets.MODEL_SIGNING_CERT }}
        run: |
          python3 src/publish/sign-manifest.py sign --scope data \
            --key-env MODEL_SIGNING_KEY --certificate-env MODEL_SIGNING_CERT

      - name: Verify against the embedded root keys
        run: |
          args=()
          for key in ${{ vars.MODEL_ROOT_PUBLIC_KEYS }}; do args+=(--public-key "$key"); done
          python3 src/publish/sign-manifest.py verify --scope data --branch main "${args[@]}"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DEV_GITHUB_TOKEN }}
          add-paths: |
            signed/manifest-data.json
            signed/manifest-data.sig.json
          commit-message: "Sign data manifest"
          title: "[Automated] Sign data manifest"
          body: |
            Re-signed `signed/manifest-data.json` for the models and consent
            pages merged into main. Generated by the sign_manifests workflow.
          branch: automated/sign-data-manifest
          delete-branch: true
          base: main
          labels: |
            automated
            signed-manifest

      - name: Enable PR auto-merge
        if: steps.create-pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.DEV_GITHUB_TOKEN }}
