name: Validate Models
on:
 push:
   branches: [ "main", "dev" ]
 pull_request:
   branches: [ "main", "dev" ]
 workflow_dispatch:

# Auto cancel previous runs if they were not completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Write permissions are required to upload the release asset.
permissions: write-all

jobs:
 validate:
   runs-on: ubuntu-24.04
   timeout-minutes: 90

   steps:
     - name: Setup EDAMAME Posture
       uses: edamametechnologies/edamame_posture_action@v1
       with:
         edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
         edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
         edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
         edamame_id: ${{ github.run_id }}
         checkout: true

     - name: Setup Python
       uses: actions/setup-python@v3.1.4
       with:
         python-version: '3.11'

     - name: Install dependencies
       run: pip install -r requirements.txt

     # The manifest signer installs only these, pinned by hash, in a job that
     # holds the signing key and runs on main alone: check here, without the
     # key, that they still install.
     - name: Check the signer's pinned dependencies install
       run: |
         python -m venv "$RUNNER_TEMP/signer"
         "$RUNNER_TEMP/signer/bin/python" -m pip install --require-hashes --only-binary=:all: -r src/publish/requirements-sign.txt
         "$RUNNER_TEMP/signer/bin/python" -c 'import cryptography; print("cryptography", cryptography.__version__)'

     - name: Validate models
       id: validate
       run: |
         echo "Validating all threat models"
         set -o pipefail
         if ! python3 src/publish/validate-models.py threatmodel-*.json 2>&1 | tee validate_models_output.txt; then
           echo "Validation Failed!"
           # Use GITHUB_OUTPUT environment file
           echo "error_message<<EOF" >> $GITHUB_OUTPUT
           head -n 10 validate_models_output.txt >> $GITHUB_OUTPUT
           echo "EOF" >> $GITHUB_OUTPUT
           exit 1
         fi

     - name: Validate whitelists
       id: validate_whitelist
       run: |
         echo "Validating all whitelists"
         set -o pipefail
         if ! python3 src/publish/validate-models.py whitelists-db.json 2>&1 | tee validate_whitelist_output.txt; then
           echo "Validation Failed!"
           echo "error_message_whitelist<<EOF" >> $GITHUB_OUTPUT
           head -n 10 validate_whitelist_output.txt >> $GITHUB_OUTPUT
           echo "EOF" >> $GITHUB_OUTPUT
           exit 1
         fi

     - name: Validate blacklists
       id: validate_blacklist
       run: |
         echo "Validating all blacklists"
         set -o pipefail
         if ! python3 src/publish/validate-models.py blacklists-db.json 2>&1 | tee validate_blacklist_output.txt; then
           echo "Validation Failed!"
           echo "error_message_blacklist<<EOF" >> $GITHUB_OUTPUT
           head -n 10 validate_blacklist_output.txt >> $GITHUB_OUTPUT
           echo "EOF" >> $GITHUB_OUTPUT
           exit 1
         fi

     - name: Validate lanscan profiles
       id: validate_lanscan
       run: |
         echo "Validating all lanscan profiles"
         set -o pipefail
         if ! python3 src/publish/validate-models.py lanscan-profiles-db.json 2>&1 | tee validate_lanscan_output.txt; then
           echo "Validation Failed!"
           echo "error_message_lanscan<<EOF" >> $GITHUB_OUTPUT
           head -n 10 validate_lanscan_output.txt >> $GITHUB_OUTPUT
           echo "EOF" >> $GITHUB_OUTPUT
           exit 1
         fi

     - name: Validate sensitive paths
       id: validate_sensitive_paths
       run: |
         echo "Validating sensitive paths"
         set -o pipefail
         if ! python3 src/publish/validate-models.py sensitive-paths-db.json 2>&1 | tee validate_sensitive_paths_output.txt; then
           echo "Validation Failed!"
           echo "error_message_sensitive_paths<<EOF" >> $GITHUB_OUTPUT
           head -n 10 validate_sensitive_paths_output.txt >> $GITHUB_OUTPUT
           echo "EOF" >> $GITHUB_OUTPUT
           exit 1
         fi

     - name: Validate CVE detection params
       id: validate_cve_params
       run: |
         echo "Validating CVE detection params"
         set -o pipefail
         if ! python3 src/publish/validate-models.py cve-detection-params-db.json 2>&1 | tee validate_cve_params_output.txt; then
           echo "Validation Failed!"
           echo "error_message_cve_params<<EOF" >> $GITHUB_OUTPUT
           head -n 10 validate_cve_params_output.txt >> $GITHUB_OUTPUT
           echo "EOF" >> $GITHUB_OUTPUT
           exit 1
         fi

 notify:
   name: Slack alert
   needs: [validate]
   if: always() && github.event_name != 'pull_request'
   uses: edamametechnologies/.github/.github/workflows/slack-notify.yml@main
   with:
     results: ${{ toJSON(needs) }}
   secrets:
     SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
