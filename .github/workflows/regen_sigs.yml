name: Verify generated threatmodel artifacts
on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - 'threatmodel-*.json'
      - 'whitelists-db.json'
      - 'blacklists-db.json'
      - 'lanscan-profiles-db.json'
      - 'sensitive-paths-db.json'
      - 'cve-detection-params-db.json'
      - 'agent-visibility-params-db.json'
      - 'lanscan-port-vulns-db.json'
      - 'lanscan-vendor-vulns-db.json'
      - 'signed/**'

concurrency:
  group: verify-generated-artifacts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v3.1.4
        with:
          python-version: 3.11.3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate artifacts
        run: make update

      - name: Verify generated artifacts are current
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Generated threatmodel artifacts are out of date."
            echo "Run 'make update' locally and commit the resulting changes."
            git status --short
            exit 1
          fi

      # A PR that changes a threat model must carry the exec manifest signed
      # offline with a root key (src/publish/sign-manifest.py). Clients refuse
      # an unsigned exec model anyway; this stops the PR from merging one.
      # Skipped until the root public keys are configured.
      - name: Verify exec manifest signature
        if: vars.MODEL_ROOT_PUBLIC_KEYS != ''
        run: |
          args=()
          for key in ${{ vars.MODEL_ROOT_PUBLIC_KEYS }}; do args+=(--public-key "$key"); done
          python3 src/publish/sign-manifest.py verify --scope exec --branch "${{ github.base_ref }}" "${args[@]}"
